html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0;font-family:'Poppins',system-ui,sans-serif;font-weight:400}
body{background:var(--bg);color:var(--ink);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
a{color:inherit;text-decoration:none}button{background:none;border:0;color:inherit;cursor:pointer;font-size:inherit}
.w{max-width:1280px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
section{padding:clamp(56px,9vw,120px) 0}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}.eyebrow:before{content:"";width:28px;height:1px;background:currentColor}
h2{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.035em;line-height:1.05;margin:14px 0 clamp(28px,4vw,56px)}
p{line-height:1.7;color:var(--mute)}
[data-r]{opacity:0}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;background:var(--ink);color:var(--bg);transition:transform .3s,background .3s;font-size:.92rem}.btn:hover{transform:translateY(-3px);background:var(--acb);color:#fff}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.o:hover{border-color:var(--ac);color:var(--ac);background:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.lg{background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:560/437}
@media(prefers-reduced-motion:reduce){.mq div{animation:none}}
.ld{position:fixed;inset:0;z-index:99;background:#5f0917;color:#f6e9dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.ld .lg{width:min(300px,64vw)}
.ld-bar{width:min(280px,60vw);height:2px;background:#f6e9dc;transform-origin:left}.ld-n{font-size:.8rem;letter-spacing:.3em;color:#e8c9c4}
.cur{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--acb);color:#fff;padding:8px 16px;border-radius:99px;font-size:.78rem;transform:scale(0);white-space:nowrap}
@media(hover:none){.cur{display:none}}
nav{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:block;color:var(--acb)}.logo .lg{height:56px;width:auto}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:#f6e9dc}}
.links{display:flex;gap:6px}.links a{padding:9px 16px;border-radius:99px;font-size:.88rem;color:var(--mute);transition:.25s}.links a:hover,.links a.on{color:var(--ink);background:var(--card)}
.nr{display:flex;gap:10px;align-items:center}.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;background:var(--card)}
.ib b{position:absolute;top:-4px;right:-4px;background:var(--acb);color:#fff;border-radius:99px;font-size:.65rem;min-width:18px;height:18px;display:grid;place-items:center}
.burger{display:none}
@media(max-width:820px){.burger{display:grid}.links{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;background:var(--bg);padding:16px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1}.links.open{transform:none}.links a{padding:14px 18px;font-size:1rem}}
.hero{min-height:100svh;padding:calc(68px + clamp(40px,8vw,90px)) 0 60px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.6rem,8.4vw,7.4rem);letter-spacing:-.05em;line-height:1;max-width:11ch}
.hero h1 span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}.hero h1 em{font-style:normal;display:inline-block;color:var(--ac)}
.hero .sub{max-width:46ch;margin:28px 0 36px;font-size:clamp(1rem,1.5vw,1.15rem)}
.hrow{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:absolute;right:clamp(-60px,2vw,40px);top:50%;width:min(46vw,560px);aspect-ratio:1;transform:translateY(-45%);pointer-events:none}

.hero-art svg{width:78%;height:auto}
@media(max-width:900px){.hero-art{position:relative;width:100%;transform:none;right:0;top:0;margin-top:40px;aspect-ratio:1.1}.hero h1{max-width:none}}

.mq div{display:flex;gap:56px;width:max-content;animation:mq 32s linear infinite}.mq span{font-size:clamp(1.3rem,3vw,2.2rem);letter-spacing:-.02em;white-space:nowrap}.mq span:nth-child(even){color:#f3c9a8}
@keyframes mq{to{transform:translateX(-50%)}}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cat{border-radius:26px;padding:26px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .5s cubic-bezier(.2,.8,.2,1);background:var(--tt);color:var(--ink);position:relative;overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
